[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every unknown path returns index.html so the client router
# can resolve the URL. Also defined in public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for public folder assets: always revalidate with server
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Pragma = "no-cache"
